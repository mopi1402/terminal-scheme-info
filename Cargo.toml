[package]
name = "terminal-scheme-info"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Pierre Moati <pierre@moati.fr>"]
description = "Expose the terminal's background, foreground and colour scheme to the shell session as environment variables"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mopi1402/terminal-scheme-info"
keywords = ["terminal", "colors", "theme", "dark-mode", "osc"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
