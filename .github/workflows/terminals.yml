name: terminals

# Runs one real query inside the popular Linux terminal emulators, under Xvfb
# on a GitHub runner, and writes the table to the run summary. macOS terminals
# are measured locally with scripts/try-terminals.sh: the macOS and Windows
# runners have no graphical session a terminal emulator can start in.

on:
  workflow_dispatch:

jobs:
  linux:
    name: linux terminals
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release --locked
      - name: install terminals
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-bin dbus-x11 libgl1-mesa-dri mesa-utils \
            xterm gnome-terminal konsole xfce4-terminal kitty alacritty terminator tilix \
            rxvt-unicode stterm lxterminal mate-terminal qterminal
          curl -fsSL -o wezterm.deb \
            https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb
          sudo apt-get install -y ./wezterm.deb || echo "::warning::wezterm did not install"
      - name: probe
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- scripts/try-terminals-linux.sh > probe.log 2>&1 || true
          grep '^|' probe.log | tee terminals-linux.md
        timeout-minutes: 10
      - run: cat terminals-linux.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: terminals-linux
          path: terminals-linux.md
