name: release

# Pushing a tag `vX.Y.Z` publishes the crate on crates.io (trusted publishing,
# no stored token), builds the six binaries, publishes a GitHub release with a
# SHA256SUMS file, and updates the Homebrew tap and the Scoop bucket.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }

  crates-io:
    name: crates.io
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-15 }
          - { target: aarch64-apple-darwin,       os: macos-15 }
          - { target: x86_64-pc-windows-msvc,     os: windows-2025 }
          - { target: aarch64-pc-windows-msvc,    os: windows-2025 }
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -eu
          name=terminal-scheme-info
          dir="$name-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$dir"
          cp README.md LICENSE "$dir"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/$name.exe" "$dir"
              7z a "$dir.zip" "$dir" ;;
            *)
              cp "target/${{ matrix.target }}/release/$name" "$dir"
              tar czf "$dir.tar.gz" "$dir" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            terminal-scheme-info-*.tar.gz
            terminal-scheme-info-*.zip
          if-no-files-found: error

  publish:
    name: github release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  packages:
    name: homebrew tap and scoop bucket
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: scripts/package-manifests.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS out
      - name: push to the tap and the bucket
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set: run scripts/package-manifests.sh and update homebrew-tap and scoop-bucket by hand"
            exit 0
          fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mopi1402/homebrew-tap.git"
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mopi1402/scoop-bucket.git"
          cp out/terminal-scheme-info.rb homebrew-tap/Formula/
          cp out/terminal-scheme-info.json scoop-bucket/bucket/
          for repo in homebrew-tap scoop-bucket; do
            git -C "$repo" -c user.name="Pierre Moati" -c user.email="pierre@moati.fr" commit -qam "terminal-scheme-info $GITHUB_REF_NAME"
            git -C "$repo" push -q
          done
